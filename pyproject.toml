[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-demand"
version = "0.1.0"
description = "End-to-end retail demand forecasting and inventory intelligence system"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]